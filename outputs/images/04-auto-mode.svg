<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="'Source Han Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>自动模式分级</title>
  <desc>SpecCore 三级自动模式: 手动、部分自动、全自动</desc>
  <rect width="1200" height="480" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-weight="500" font-size="22" fill="#2C2C2A">自动模式分级控制</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#888780">用户明确意图 → AI 精确执行</text>

  <!-- 1. 手动模式 -->
  <g>
    <rect x="40" y="90" width="1120" height="100" rx="16" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
    <rect x="40" y="90" width="6" height="100" rx="3" fill="#378ADD"/>
    <circle cx="100" cy="140" r="22" fill="#378ADD"/>
    <text x="100" y="146" text-anchor="middle" font-size="18" font-weight="500" fill="#fff">1</text>
    <text x="140" y="130" font-size="18" font-weight="500" fill="#185FA5">手动模式</text>
    <text x="140" y="158" font-size="13" fill="#0C447C">每步展示结果,等待用户确认后再执行下一步</text>
    <text x="140" y="178" font-size="13" fill="#0C447C">适合: 关键决策多 / 风险高 / 探索性任务</text>
    <rect x="920" y="118" width="200" height="44" rx="22" fill="#378ADD"/>
    <text x="1020" y="146" text-anchor="middle" font-size="14" fill="#fff" font-weight="500">人主导 · AI 辅助</text>
  </g>

  <!-- Arrow -->
  <line x1="600" y1="200" x2="600" y2="218" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="212" font-size="11" fill="#5F5E5A">自动化程度提升</text>

  <!-- 2. 部分自动 -->
  <g>
    <rect x="40" y="220" width="1120" height="100" rx="16" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
    <rect x="40" y="220" width="6" height="100" rx="3" fill="#639922"/>
    <circle cx="100" cy="270" r="22" fill="#639922"/>
    <text x="100" y="276" text-anchor="middle" font-size="18" font-weight="500" fill="#fff">2</text>
    <text x="140" y="260" font-size="18" font-weight="500" fill="#3B6D11">部分自动模式</text>
    <text x="140" y="288" font-size="13" fill="#27500A">analyze + plan 自动连续执行,execute 前暂停确认</text>
    <text x="140" y="308" font-size="13" fill="#27500A">适合: 频繁重复流程 + 关键步骤需审核</text>
    <rect x="920" y="248" width="200" height="44" rx="22" fill="#639922"/>
    <text x="1020" y="276" text-anchor="middle" font-size="14" fill="#fff" font-weight="500">人机协同</text>
  </g>

  <!-- Arrow -->
  <line x1="600" y1="330" x2="600" y2="348" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="342" font-size="11" fill="#5F5E5A">自动化程度提升</text>

  <!-- 3. 全自动 -->
  <g>
    <rect x="40" y="350" width="1120" height="100" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <rect x="40" y="350" width="6" height="100" rx="3" fill="#534AB7"/>
    <circle cx="100" cy="400" r="22" fill="#534AB7"/>
    <text x="100" y="406" text-anchor="middle" font-size="18" font-weight="500" fill="#fff">3</text>
    <text x="140" y="390" font-size="18" font-weight="500" fill="#3C3489">全自动模式</text>
    <text x="140" y="418" font-size="13" fill="#26215C">所有步骤不等确认,全流程自动执行</text>
    <text x="140" y="438" font-size="13" fill="#26215C">适合: 已验证流程 / 紧急修复 / 后台批处理</text>
    <rect x="920" y="378" width="200" height="44" rx="22" fill="#534AB7"/>
    <text x="1020" y="406" text-anchor="middle" font-size="14" fill="#fff" font-weight="500">AI 自主 · 人监督</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
</svg>