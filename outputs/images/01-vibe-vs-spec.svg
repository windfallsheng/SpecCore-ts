<svg viewBox="0 0 680 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Source Han Sans SC', 'Roboto', sans-serif;">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
  <title>Vibe Coding vs Spec Coding</title>
  <desc>两种 AI 编程模式对比</desc>
  <rect width="680" height="320" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-weight="500" font-size="15" fill="#2C2C2A">Vibe Coding vs Spec Coding</text>
  <rect x="40" y="50" width="280" height="240" rx="16" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="180" y="76" text-anchor="middle" font-weight="500" font-size="14" fill="#A32D2D">Vibe Coding</text>
  <text x="180" y="96" text-anchor="middle" font-size="11" fill="#A32D2D">感觉驱动的AI编程</text>
  <rect x="58" y="110" width="244" height="32" rx="6" fill="#fff" stroke="#F09595" stroke-width="0.5"/>
  <text x="180" y="130" text-anchor="middle" font-size="12" fill="#4A1B0C">自然语言描述,AI生成代码</text>
  <text x="180" y="160" text-anchor="middle" font-size="11" fill="#791F1F">无文档,无规范,无追溯</text>
  <text x="180" y="182" text-anchor="middle" font-size="11" fill="#791F1F">3个月后代码不可维护</text>
  <text x="180" y="204" text-anchor="middle" font-size="11" fill="#791F1F">团队协作上下文断裂</text>
  <text x="180" y="226" text-anchor="middle" font-size="11" fill="#791F1F">需求变更推倒重来</text>
  <rect x="58" y="242" width="244" height="28" rx="6" fill="#E24B4A"/>
  <text x="180" y="260" text-anchor="middle" font-size="12" fill="#fff" font-weight="500">致命缺陷: 90天墙</text>
  <rect x="360" y="50" width="280" height="240" rx="16" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="500" y="76" text-anchor="middle" font-weight="500" font-size="14" fill="#3B6D11">Spec Coding</text>
  <text x="500" y="96" text-anchor="middle" font-size="11" fill="#3B6D11">规范驱动的AI研发</text>
  <rect x="378" y="110" width="244" height="32" rx="6" fill="#fff" stroke="#97C459" stroke-width="0.5"/>
  <text x="500" y="130" text-anchor="middle" font-size="12" fill="#173404">先写文档,AI理解,生成代码</text>
  <text x="500" y="160" text-anchor="middle" font-size="11" fill="#27500A">Spec是唯一事实源</text>
  <text x="500" y="182" text-anchor="middle" font-size="11" fill="#27500A">原子任务按需加载</text>
  <text x="500" y="204" text-anchor="middle" font-size="11" fill="#27500A">知识持续沉淀复用</text>
  <text x="500" y="226" text-anchor="middle" font-size="11" fill="#27500A">反向同步保持一致</text>
  <rect x="378" y="242" width="244" height="28" rx="6" fill="#639922"/>
  <text x="500" y="260" text-anchor="middle" font-size="12" fill="#fff" font-weight="500">核心: No Spec, No Code</text>
  <line x1="320" y1="170" x2="358" y2="170" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="339" y="162" text-anchor="middle" font-size="10" fill="#5F5E5A">升级</text>
</svg>
