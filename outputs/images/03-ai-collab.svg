<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="'Source Han Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
  <title>AI 宿主协作流程</title>
  <desc>SpecCore CLI 与 AI 宿主协作的双向流程图</desc>
  <rect width="1200" height="540" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-weight="500" font-size="22" fill="#2C2C2A">AI-宿主 协作流程</text>

  <!-- Section labels -->
  <text x="120" y="78" font-size="14" font-weight="500" fill="#185FA5">▍正向：需求 → 代码</text>
  <text x="600" y="298" text-anchor="middle" font-size="14" font-weight="500" fill="#888780">↓ 双向同步 ↓</text>
  <text x="120" y="338" font-size="14" font-weight="500" fill="#993C1D">▍反向：变更 → 沉淀</text>

  <!-- Top row: forward flow -->
  <!-- Node 1: 用户需求 -->
  <g>
    <rect x="40" y="100" width="220" height="100" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="150" y="132" text-anchor="middle" font-size="18" font-weight="500" fill="#3C3489">用户需求</text>
    <text x="150" y="158" text-anchor="middle" font-size="13" fill="#534AB7">自然语言 / PRD</text>
    <text x="150" y="180" text-anchor="middle" font-size="13" fill="#534AB7">意图描述</text>
  </g>
  <line x1="262" y1="150" x2="296" y2="150" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2: SpecCore CLI -->
  <g>
    <rect x="300" y="100" width="220" height="100" rx="16" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="410" y="132" text-anchor="middle" font-size="18" font-weight="500" fill="#0F6E56">SpecCore CLI</text>
    <text x="410" y="158" text-anchor="middle" font-size="13" fill="#1D9E75">规范解析</text>
    <text x="410" y="180" text-anchor="middle" font-size="13" fill="#1D9E75">任务调度</text>
  </g>
  <line x1="522" y1="150" x2="556" y2="150" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3: AI Agent -->
  <g>
    <rect x="560" y="100" width="220" height="100" rx="16" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
    <text x="670" y="132" text-anchor="middle" font-size="18" font-weight="500" fill="#185FA5">AI Agent</text>
    <text x="670" y="158" text-anchor="middle" font-size="13" fill="#378ADD">按 Spec 执行</text>
    <text x="670" y="180" text-anchor="middle" font-size="13" fill="#378ADD">上下文管理</text>
  </g>
  <line x1="782" y1="150" x2="816" y2="150" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 4: 代码生成 -->
  <g>
    <rect x="820" y="100" width="220" height="100" rx="16" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
    <text x="930" y="132" text-anchor="middle" font-size="18" font-weight="500" fill="#993C1D">代码生成</text>
    <text x="930" y="158" text-anchor="middle" font-size="13" fill="#D85A30">文件读写 / 编辑</text>
    <text x="930" y="180" text-anchor="middle" font-size="13" fill="#D85A30">持续交付</text>
  </g>

  <!-- Bottom row: reverse flow -->
  <!-- Node 5: 生命周期 -->
  <g>
    <rect x="40" y="370" width="220" height="100" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="150" y="402" text-anchor="middle" font-size="18" font-weight="500" fill="#3C3489">生命周期</text>
    <text x="150" y="428" text-anchor="middle" font-size="13" fill="#534AB7">需求变更 / 迭代</text>
    <text x="150" y="450" text-anchor="middle" font-size="13" fill="#534AB7">Bug 反馈</text>
  </g>
  <line x1="262" y1="420" x2="296" y2="420" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 6: 知识沉淀 -->
  <g>
    <rect x="300" y="370" width="220" height="100" rx="16" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
    <text x="410" y="402" text-anchor="middle" font-size="18" font-weight="500" fill="#3B6D11">知识沉淀</text>
    <text x="410" y="428" text-anchor="middle" font-size="13" fill="#639922">PATTERNS/</text>
    <text x="410" y="450" text-anchor="middle" font-size="13" fill="#639922">CONSTITUTION.md</text>
  </g>
  <line x1="522" y1="420" x2="556" y2="420" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 7: 反向同步 -->
  <g>
    <rect x="560" y="370" width="220" height="100" rx="16" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
    <text x="670" y="402" text-anchor="middle" font-size="18" font-weight="500" fill="#854F0B">反向同步</text>
    <text x="670" y="428" text-anchor="middle" font-size="13" fill="#EF9F27">代码 → Spec</text>
    <text x="670" y="450" text-anchor="middle" font-size="13" fill="#EF9F27">变更履历</text>
  </g>
  <line x1="782" y1="420" x2="816" y2="420" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 8: 变更检测 -->
  <g>
    <rect x="820" y="370" width="220" height="100" rx="16" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5"/>
    <text x="930" y="402" text-anchor="middle" font-size="18" font-weight="500" fill="#A32D2D">变更检测</text>
    <text x="930" y="428" text-anchor="middle" font-size="13" fill="#E24B4A">差异比对</text>
    <text x="930" y="450" text-anchor="middle" font-size="13" fill="#E24B4A">冲突裁决 L1/L2/L3</text>
  </g>

  <!-- Bottom: 核心原则 -->
  <rect x="240" y="498" width="720" height="32" rx="6" fill="#F8F9FB" stroke="#888780" stroke-width="0.5"/>
  <text x="600" y="518" text-anchor="middle" font-size="13" fill="#5F5E5A">核心原则：Spec 是唯一事实源 · 原子任务按需加载 · 反向同步保持一致</text>

  <!-- Side arrows connecting top and bottom -->
  <path d="M930 200 Q 1080 285 930 370" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M150 200 Q 0 285 150 370" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4,3"/>
</svg>