<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Source Han Sans SC', 'Roboto', sans-serif;">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 2L5 5L2 8" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="680" height="320" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-weight="500" font-size="15" fill="#2C2C2A">AI-宿主 协作流程</text>

  <!-- ===== Top Flow: 正向执行 ===== -->

  <!-- 用户输入 -->
  <rect x="30" y="60" width="120" height="70" rx="10" fill="#EBF0FF" stroke="#7399F5" stroke-width="0.8"/>
  <text x="90" y="86" text-anchor="middle" font-weight="500" font-size="13" fill="#2563EB">用户需求</text>
  <text x="90" y="106" text-anchor="middle" font-size="10" fill="#5178E0">自然语言 / PRD</text>

  <line x1="152" y1="95" x2="188" y2="95" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- SpecCore CLI -->
  <rect x="190" y="60" width="130" height="70" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="0.8"/>
  <text x="255" y="82" text-anchor="middle" font-weight="500" font-size="13" fill="#16A34A">SpecCore CLI</text>
  <text x="255" y="100" text-anchor="middle" font-size="10" fill="#4ADE80">规范解析</text>
  <text x="255" y="116" text-anchor="middle" font-size="10" fill="#4ADE80">任务调度</text>

  <line x1="322" y1="95" x2="358" y2="95" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- AI Agent -->
  <rect x="360" y="60" width="130" height="70" rx="10" fill="#F5F0FF" stroke="#C4B5FD" stroke-width="0.8"/>
  <text x="425" y="82" text-anchor="middle" font-weight="500" font-size="13" fill="#7C3AED">AI Agent</text>
  <text x="425" y="100" text-anchor="middle" font-size="10" fill="#A78BFA">按 Spec 执行</text>
  <text x="425" y="116" text-anchor="middle" font-size="10" fill="#A78BFA">上下文管理</text>

  <line x1="492" y1="95" x2="528" y2="95" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 代码生成 -->
  <rect x="530" y="60" width="120" height="70" rx="10" fill="#EBF0FF" stroke="#7399F5" stroke-width="0.8"/>
  <text x="590" y="86" text-anchor="middle" font-weight="500" font-size="13" fill="#2563EB">代码生成</text>
  <text x="590" y="106" text-anchor="middle" font-size="10" fill="#5178E0">文件读写 / 编辑</text>

  <!-- ===== Divider ===== -->
  <line x1="40" y1="155" x2="640" y2="155" stroke="#E8E8E5" stroke-width="0.5"/>
  <rect x="290" y="149" width="100" height="14" rx="7" fill="#fff"/>
  <text x="340" y="159" text-anchor="middle" font-size="10" fill="#888780">双向同步</text>

  <!-- ===== Bottom Flow: 反向同步 ===== -->

  <!-- 代码变更检测 -->
  <rect x="530" y="175" width="120" height="60" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="0.8"/>
  <text x="590" y="200" text-anchor="middle" font-weight="500" font-size="12" fill="#C2410C">变更检测</text>
  <text x="590" y="218" text-anchor="middle" font-size="10" fill="#F97316">文件监控</text>

  <line x1="528" y1="205" x2="492" y2="205" stroke="#C2410C" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- 反向同步 -->
  <rect x="360" y="175" width="130" height="60" rx="10" fill="#F5F0FF" stroke="#C4B5FD" stroke-width="0.8"/>
  <text x="425" y="200" text-anchor="middle" font-weight="500" font-size="12" fill="#7C3AED">反向同步</text>
  <text x="425" y="218" text-anchor="middle" font-size="10" fill="#A78BFA">代码 → Spec</text>

  <line x1="358" y1="205" x2="322" y2="205" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- 知识沉淀 -->
  <rect x="190" y="175" width="130" height="60" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="0.8"/>
  <text x="255" y="200" text-anchor="middle" font-weight="500" font-size="12" fill="#16A34A">知识沉淀</text>
  <text x="255" y="218" text-anchor="middle" font-size="10" fill="#4ADE80">KNOWLEDGE.md</text>

  <line x1="188" y1="205" x2="152" y2="205" stroke="#16A34A" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- 生命周期 -->
  <rect x="30" y="175" width="120" height="60" rx="10" fill="#EBF0FF" stroke="#7399F5" stroke-width="0.8"/>
  <text x="90" y="200" text-anchor="middle" font-weight="500" font-size="12" fill="#2563EB">生命周期</text>
  <text x="90" y="218" text-anchor="middle" font-size="10" fill="#5178E0">需求变更联动</text>

  <!-- ===== Key Principles ===== -->
  <rect x="160" y="260" width="360" height="44" rx="8" fill="#F8F7F5" stroke="#D4D3D1" stroke-width="0.5"/>
  <text x="340" y="278" text-anchor="middle" font-size="11" fill="#5F5E5A">核心原则</text>
  <text x="340" y="294" text-anchor="middle" font-size="11" fill="#2C2C2A" font-weight="500">Spec 是唯一事实源 · 原子任务按需加载 · 知识持续沉淀复用 · 反向同步保持一致</text>
</svg>
