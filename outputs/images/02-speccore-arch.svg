  <!-- Arrow from 反向同步 back up (loop) -->
  <path d="M610 382 Q640 382 640 340 Q640 50 640 50 Q640 46 636 46" fill="none" stroke="#C4B5FD" stroke-width="1" stroke-dasharray="4,3"/>
