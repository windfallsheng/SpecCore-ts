<!DOCTYPE html><html lang="zh-CN" data-theme="ocean"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SpecCore Dev · Pipeline</title><style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap');[data-theme="ocean"]{--cyan:#0ea5e9;--bg:#0b1929;--card:rgba(13,31,56,.95);--border:rgba(14,165,233,.15);--text:#bae6fd;--muted:#5b7fa5;--green:#14b8a6;--orange:#f97316;--purple:#6366f1}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.scanlines{position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,240,255,.01) 2px,rgba(0,240,255,.01) 4px)}.card{max-width:640px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;position:relative;overflow:hidden}.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scanX 3s linear infinite}.card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scanX-rev 3s linear infinite}@keyframes scanX{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}@keyframes scanX-rev{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}@keyframes scanY{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}@keyframes scanY-rev{0%{transform:translateY(100%)}100%{transform:translateY(-100%)}}.vline{position:absolute;top:0;width:1px;bottom:0;pointer-events:none}.vline.l{left:0;background:linear-gradient(180deg,transparent,var(--cyan),transparent);animation:scanY-rev 3s linear infinite}.vline.r{right:0;background:linear-gradient(180deg,transparent,var(--cyan),transparent);animation:scanY 3s linear infinite}h1{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}.sub{color:var(--muted);font-size:12px;margin:8px 0 24px}.flow{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:16px 0}.phase{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:8px;font-size:10px}.phase.done{background:rgba(20,184,166,.08);color:var(--green)}.phase.current{background:rgba(14,165,233,.12);color:var(--cyan);border:1px solid rgba(14,165,233,.3)}.phase.pending{background:rgba(255,255,255,.02);color:var(--muted)}.phase-arrow{color:var(--muted);font-size:12px}.section{margin:20px 0;padding:16px;background:rgba(14,165,233,.03);border:1px solid rgba(14,165,233,.08);border-radius:10px}.section-title{font-size:11px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}.next-cmd{display:block;padding:12px 16px;background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.2);border-radius:8px;color:var(--cyan);font-weight:600;margin-top:8px;cursor:pointer;transition:all .2s}.next-cmd:hover{background:rgba(14,165,233,.2)}.footer{text-align:center;color:var(--muted);font-size:10px;margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,.04)}</style></head><body><div class="scanlines"></div><div class="card"><div class="vline l"></div><div class="vline r"></div><h1>SPECCORE DEV</h1><div class="sub">智能级联 · 自动推进 · v5.25.3 · 期次-Q2</div><div class="section"><div class="section-title">🔄 Pipeline 状态</div><div class="flow"><div class="phase done"><span class="phase-icon">🏗️</span><span class="phase-name">初始化</span><span class="phase-arrow">→</span></div><div class="phase current"><span class="phase-icon">📝</span><span class="phase-name">导入需求</span><span class="phase-arrow">→</span></div><div class="phase pending"><span class="phase-icon">🧠</span><span class="phase-name">分析需求</span><span class="phase-arrow">→</span></div><div class="phase pending"><span class="phase-icon">📦</span><span class="phase-name">拆分任务</span><span class="phase-arrow">→</span></div><div class="phase pending"><span class="phase-icon">⚡</span><span class="phase-name">执行开发</span><span class="phase-arrow">→</span></div><div class="phase pending"><span class="phase-icon">🔀</span><span class="phase-name">提交 PR</span><span class="phase-arrow">→</span></div><div class="phase pending"><span class="phase-icon">✅</span><span class="phase-name">归档收尾</span></div></div></div><div class="section"><div class="section-title">📌 下一步: 导入需求</div><div class="next-cmd">$ speccore doc2spec --iteration=期次-Q2</div></div><div class="footer">由 SpecCore 驱动 v5.25.3 | 2026-08-05</div></div></body></html>
