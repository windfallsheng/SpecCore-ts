openapi: 3.0.3
info:
  title: 预订订单服务
  version: 1.0.0
paths:
  /api/v1/bookings:
    post:
      summary: 创建预订
      tags: [预订]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, date, startTime, endTime, title]
              properties:
                roomId: { type: integer }
                date: { type: string, format: date }
                startTime: { type: string, example: "09:00" }
                endTime: { type: string, example: "10:00" }
                title: { type: string, maxLength: 200 }
                attendees: { type: string }
      responses:
        '200': { description: 预订成功 }
        '400': { description: 不可预订过去时间(code=2003) }
        '409': { description: 时间冲突(code=2001) }
    get:
      summary: 我的预订列表
      tags: [预订]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string, enum: [active, cancelled] }
      responses:
        '200': { description: 分页列表 }

  /api/v1/bookings/{id}:
    get:
      summary: 预订详情
      tags: [预订]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 成功 }
        '404': { description: 不存在(code=2002) }
    delete:
      summary: 取消预订
      tags: [预订]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 取消成功 }
        '404': { description: 不存在(code=2002) }

  /api/v1/bookings/check-conflict:
    post:
      summary: 时间冲突检测
      tags: [预订]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, date, startTime, endTime]
              properties:
                roomId: { type: integer }
                date: { type: string, format: date }
                startTime: { type: string }
                endTime: { type: string }
      responses:
        '200':
          description: 检测结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasConflict: { type: boolean }
                  conflictDetail: { type: string }
