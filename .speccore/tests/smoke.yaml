# 标准冒烟测试配置（v8.3.60+）
# 目标：验证"系统能启动、核心页面能打开、不白屏"
# 适用：每次构建后、部署前快速门禁
# 执行：speccore verify --config .speccore/tests/smoke.yaml --env-file staging

name: 标准冒烟测试

target:
  base_url: https://staging.example.com

# 测试场景：只覆盖核心页面，不做复杂交互
tests:
  - name: 首页-加载检查
    type: smoke
    routes: [/]
    threshold: normal

  - name: 登录页-加载检查
    type: smoke
    routes: [/login]
    threshold: normal

  - name: 核心模块页面
    type: smoke
    routes:
      - /dashboard
      - /orders
      - /products
    threshold: normal

# 视觉模型配置（可选，用于单图质量扫描）
visual_model:
  provider: qwen-vl
  model: qwen-vl-max
  timeout: 30000

# 输出配置
output: ./reports/smoke-test-report.html
