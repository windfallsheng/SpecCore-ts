<!DOCTYPE html><html lang="zh-CN" data-theme="ocean"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SpecCore Ask · 计划任务</title><style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap');[data-theme="ocean"]{--cyan:#0ea5e9;--bg:#0b1929;--card:rgba(13,31,56,.95);--border:rgba(14,165,233,.15);--text:#bae6fd;--muted:#5b7fa5;--green:#14b8a6;--orange:#f97316;--purple:#6366f1}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:40px 20px}.scanlines{position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,240,255,.01) 2px,rgba(0,240,255,.01) 4px)}.card{max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;position:relative;overflow:hidden}.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scanX 3s linear infinite}.card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scanX-rev 3s linear infinite}@keyframes scanX{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}@keyframes scanX-rev{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}@keyframes scanY{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}@keyframes scanY-rev{0%{transform:translateY(100%)}100%{transform:translateY(-100%)}}.vline{position:absolute;top:0;width:1px;bottom:0;pointer-events:none}.vline.l{left:0;background:linear-gradient(180deg,transparent,var(--cyan),transparent);animation:scanY-rev 3s linear infinite}.vline.r{right:0;background:linear-gradient(180deg,transparent,var(--cyan),transparent);animation:scanY 3s linear infinite}h1{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}.query{color:var(--muted);font-size:12px;margin:8px 0 20px}.badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:1px;background:#0ea5e922;color:#0ea5e9;border:1px solid #0ea5e944;margin-bottom:16px}.section{margin:16px 0;padding:14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:10px}.pipeline{display:flex;flex-direction:column;gap:12px}.step{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 14px;background:rgba(14,165,233,.04);border-left:2px solid #0ea5e9;border-radius:0 8px 8px 0}.step-num{font-family:Orbitron;font-size:18px;font-weight:900;color:var(--cyan);min-width:36px}.step-cmd{font-weight:600;color:var(--green)}.step-args{color:var(--muted);font-size:11px}.step-desc{color:var(--muted);font-size:10px;flex-basis:100%}.step-dep{font-size:9px;color:var(--orange);margin-left:auto}code{background:rgba(14,165,233,.1);padding:1px 6px;border-radius:4px;color:var(--cyan);font-size:11px}.footer{text-align:center;color:var(--muted);font-size:10px;margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,.04)}</style></head><body><div class="scanlines"></div><div class="card"><div class="vline l"></div><div class="vline r"></div><h1>SPECCORE ASK</h1><div class="query">"计划任务"</div><div class="badge">🎯 意图匹配</div><div class="section">🎯 推荐命令: <code>speccore plan<br>生成执行计划+管理历史：创建/交互/列表/详情/取消<br><br>用法:</code> <code>speccore plan</code> [--all] [--task <id>] [--interactive]<br><br>示例:<br>  $ <code>speccore plan</code> --all<br>  $ <code>speccore plan</code> --interactive</div><div class="footer">由 SpecCore 驱动 · 2026-08-05</div></div></body></html>
