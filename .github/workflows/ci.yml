name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  # ========================================
  # 1. 代码质量检查
  # ========================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx eslint . --ext .ts,.tsx || true  # ESLint 可选，不阻断流程
      - run: npx prettier --check "src/**/*.ts" || true  # Prettier 格式检查

  # ========================================
  # 2. 编译与测试
  # ========================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
        name: TypeScript 类型检查
      - run: npx vitest run --coverage
        name: 单元测试 + 覆盖率
      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        continue-on-error: true  # 私有仓库需 token，未配置时不阻断发布
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests

  # ========================================
  # 3. 安全扫描
  # ========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: 依赖漏洞扫描
        run: npm audit --audit-level=high || true
      - name: CodeQL 安全分析
        uses: github/codeql-action/init@v2
        continue-on-error: true  # 私有仓库无 Advanced Security 许可时不阻断发布
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v2
        continue-on-error: true

  # ========================================
  # 4. 自动发布（仅 release 事件触发）
  # ========================================
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    # v8.3.332+: tag push 直触发（免网页点 Publish），release published 兼容保留
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
