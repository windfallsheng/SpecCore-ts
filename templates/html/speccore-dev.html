<!DOCTYPE html><html lang="zh-CN" data-theme="ocean"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SpecCore Dev · Pipeline</title><style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap');[data-theme="ocean"]{--cyan:#0ea5e9;--bg:#0b1929;--card:rgba(13,31,56,.95);--border:rgba(14,165,233,.15);--text:#bae6fd;--muted:#5b7fa5;--green:#14b8a6;--orange:#f97316;--purple:#6366f1}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:20px}.scanlines{position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,240,255,.01) 2px,rgba(0,240,255,.01) 4px)}.card{max-width:800px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;overflow:hidden}.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scanX 3s linear infinite}.card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scanX-rev 3s linear infinite}@keyframes scanX{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}@keyframes scanX-rev{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}@keyframes scanY{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}@keyframes scanY-rev{0%{transform:translateY(100%)}100%{transform:translateY(-100%)}}.vline{position:absolute;top:0;width:1px;bottom:0;pointer-events:none}.vline.l{left:0;background:linear-gradient(180deg,transparent,var(--cyan),transparent);animation:scanY-rev 3s linear infinite}.vline.r{right:0;background:linear-gradient(180deg,transparent,var(--cyan),transparent);animation:scanY 3s linear infinite}h1{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;margin-bottom:4px}.subtitle{color:var(--muted);font-size:11px;margin-bottom:16px}.flow{display:flex;align-items:center;gap:0;margin:16px 0;flex-wrap:wrap;justify-content:center}.phase{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:12px;transition:all .3s;border:1px solid transparent}.phase.done{background:rgba(20,184,166,.1);border-color:rgba(20,184,166,.3);color:var(--green)}.phase.current{background:rgba(14,165,233,.15);border-color:rgba(14,165,233,.5);color:var(--cyan);box-shadow:0 0 16px rgba(14,165,233,.15);animation:glow 2s ease-in-out infinite}.phase.pending{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.05);color:var(--muted)}.phase-arrow{color:var(--muted);font-size:16px;margin:0 2px}@keyframes glow{0%,100%{box-shadow:0 0 16px rgba(14,165,233,.15)}50%{box-shadow:0 0 24px rgba(14,165,233,.3)}}.cur-section{padding:16px;background:rgba(14,165,233,.06);border:1px solid rgba(14,165,233,.15);border-radius:10px;margin:16px 0}.cur-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}.cur-cmd{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--cyan);background:rgba(14,165,233,.08);padding:6px 12px;border-radius:6px;display:inline-block}.action-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.action-btns button,.phase-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface, rgba(255,255,255,.03));color:var(--text);cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace;transition:all .2s}.action-btns button:hover,.phase-btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(14,165,233,.08)}.action-btns button.primary{background:rgba(14,165,233,.12);border-color:rgba(14,165,233,.4);color:var(--cyan)}.action-btns button.danger{border-color:rgba(249,115,22,.3);color:var(--orange)}.action-btns button.danger:hover{border-color:var(--orange);background:rgba(249,115,22,.08)}.phase-btn{font-size:10px;padding:6px 10px}.phase-btn.done{opacity:.4;cursor:default}.input-row{display:flex;gap:8px;margin:16px 0}.input-row input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);font-size:12px;font-family:'JetBrains Mono',monospace;outline:none;transition:all .2s}.input-row input:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(14,165,233,.1)}.input-row button{padding:10px 16px;border-radius:10px;border:1px solid var(--cyan);background:rgba(14,165,233,.1);color:var(--cyan);cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;transition:all .2s}.input-row button:hover{background:rgba(14,165,233,.2)}.result-box{margin-top:16px;padding:16px;background:rgba(14,165,233,.04);border:1px solid rgba(14,165,233,.1);border-radius:10px;display:none}.result-box.show{display:block}.result-cmd{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--green);background:rgba(20,184,166,.08);padding:6px 10px;border-radius:4px;margin:4px 0;display:inline-block}.result-summary{font-size:12px;color:var(--text);margin-bottom:8px}.quick-phase{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.footer{text-align:center;color:var(--muted);font-size:10px;margin-top:8px}.grid-pattern{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(14,165,233,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,.03) 1px,transparent 1px);background-size:60px 60px}@keyframes cardGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}.card-bg{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 25% 10%,rgba(14,165,233,.25) 0%,transparent 70%);animation:cardGlow 3s ease-in-out infinite;transform-origin:top center}@keyframes titleGlow{0%,100%{text-shadow:0 0 20px rgba(14,165,233,.4),0 0 60px rgba(14,165,233,.15)}50%{text-shadow:0 0 30px rgba(14,165,233,.7),0 0 80px rgba(14,165,233,.3)}}h1,h2{text-shadow:0 0 20px rgba(14,165,233,.4),0 0 60px rgba(14,165,233,.15);animation:titleGlow 3s ease-in-out infinite}</style></head><body><div class="scanlines"></div><div class="grid-pattern"></div>

<div class="card"><div class="card-bg"></div><div class="vline l"></div><div class="vline r"></div>
<h1>SPECCORE DEV</h1>
<div class="subtitle">期次: 期次-Q2 · 1/7 阶段完成 · Pipeline 引导</div>

<div class="flow"><div class="phase done"><span class="phase-icon">🏗️</span><span class="phase-name">初始化</span><span class="phase-arrow">→</span></div><div class="phase current"><span class="phase-icon">📝</span><span class="phase-name">导入需求</span><span class="phase-arrow">→</span></div><div class="phase pending"><span class="phase-icon">🧠</span><span class="phase-name">分析需求</span><span class="phase-arrow">→</span></div><div class="phase pending"><span class="phase-icon">📦</span><span class="phase-name">拆分任务</span><span class="phase-arrow">→</span></div><div class="phase pending"><span class="phase-icon">⚡</span><span class="phase-name">执行开发</span><span class="phase-arrow">→</span></div><div class="phase pending"><span class="phase-icon">🔀</span><span class="phase-name">提交 PR</span><span class="phase-arrow">→</span></div><div class="phase pending"><span class="phase-icon">✅</span><span class="phase-name">归档收尾</span></div></div>

<div class="cur-section">
  <div class="cur-label">📍 当前阶段</div>
  <div class="cur-cmd">📝 导入需求 → speccore doc2spec -f PRD.docx --iteration 期次-Q2</div>

  <div class="action-btns">
    <button class="primary" onclick="handleAction('next','doc')">▶ 下一步</button>
    <button onclick="handleAction('auto-all','all')">⚡ 一键自动</button>
    <button onclick="handleAction('skip-to','analyze')">⏭ 跳过当前</button>
    <button class="danger" onclick="handleAction('restart','init')">🔄 重新开始</button>
  </div>
</div>

<div class="quick-phase">
  <div style="font-size:10px;color:var(--muted);margin-right:8px;">直接跳转:</div>
  <button class="phase-btn done" disabled>🏗️ 初始化 ✓</button>
<button class="phase-btn" onclick="handleAction('jump-to','doc')" title="跳转到导入需求">📝 导入需求</button>
<button class="phase-btn" onclick="handleAction('jump-to','analyze')" title="跳转到分析需求">🧠 分析需求</button>
<button class="phase-btn" onclick="handleAction('jump-to','split')" title="跳转到拆分任务">📦 拆分任务</button>
<button class="phase-btn" onclick="handleAction('jump-to','execute')" title="跳转到执行开发">⚡ 执行开发</button>
<button class="phase-btn" onclick="handleAction('jump-to','pr')" title="跳转到提交 PR">🔀 提交 PR</button>
<button class="phase-btn" onclick="handleAction('jump-to','done')" title="跳转到归档收尾">✅ 归档收尾</button>
</div>

<div class="input-row">
  <input id="userInput" type="text" placeholder="💬 或者直接说... 比如「从分析开始」「跳过导入直接拆分」" onkeydown="if(event.key==='Enter')handleCustom()">
  <button onclick="handleCustom()">发送</button>
</div>

<div class="result-box" id="resultBox">
  <div class="result-summary" id="resultSummary"></div>
  <div id="resultCmds"></div>
</div>
</div>

<div class="footer">由 SpecCore 驱动 v5.70.0 | 2026-08-05</div>

<script>
const STATE = {&quot;iteration&quot;:&quot;期次-Q2&quot;,&quot;phases&quot;:[{&quot;name&quot;:&quot;初始化&quot;,&quot;key&quot;:&quot;init&quot;,&quot;done&quot;:true,&quot;icon&quot;:&quot;🏗️&quot;,&quot;cmd&quot;:&quot;init&quot;,&quot;description&quot;:&quot;初始化 SpecCore 项目结构&quot;,&quot;args&quot;:&quot;&quot;},{&quot;name&quot;:&quot;导入需求&quot;,&quot;key&quot;:&quot;doc&quot;,&quot;done&quot;:false,&quot;icon&quot;:&quot;📝&quot;,&quot;cmd&quot;:&quot;doc2spec&quot;,&quot;description&quot;:&quot;导入 PRD 文档，AI 转换需求规格&quot;,&quot;args&quot;:&quot;-f PRD.docx --iteration 期次-Q2&quot;},{&quot;name&quot;:&quot;分析需求&quot;,&quot;key&quot;:&quot;analyze&quot;,&quot;done&quot;:false,&quot;icon&quot;:&quot;🧠&quot;,&quot;cmd&quot;:&quot;analyze&quot;,&quot;description&quot;:&quot;AI 分析需求文档，生成审计报告&quot;,&quot;args&quot;:&quot;--iteration=期次-Q2&quot;},{&quot;name&quot;:&quot;拆分任务&quot;,&quot;key&quot;:&quot;split&quot;,&quot;done&quot;:false,&quot;icon&quot;:&quot;📦&quot;,&quot;cmd&quot;:&quot;split&quot;,&quot;description&quot;:&quot;将需求拆分为独立开发任务&quot;,&quot;args&quot;:&quot;-f REQUIREMENT.md&quot;},{&quot;name&quot;:&quot;执行开发&quot;,&quot;key&quot;:&quot;execute&quot;,&quot;done&quot;:false,&quot;icon&quot;:&quot;⚡&quot;,&quot;cmd&quot;:&quot;execute&quot;,&quot;description&quot;:&quot;按计划分批执行开发任务&quot;,&quot;args&quot;:&quot;--auto&quot;},{&quot;name&quot;:&quot;提交 PR&quot;,&quot;key&quot;:&quot;pr&quot;,&quot;done&quot;:false,&quot;icon&quot;:&quot;🔀&quot;,&quot;cmd&quot;:&quot;pr&quot;,&quot;description&quot;:&quot;代码提交后创建 Pull Request&quot;,&quot;args&quot;:&quot;--auto&quot;},{&quot;name&quot;:&quot;归档收尾&quot;,&quot;key&quot;:&quot;done&quot;,&quot;done&quot;:false,&quot;icon&quot;:&quot;✅&quot;,&quot;cmd&quot;:&quot;done&quot;,&quot;description&quot;:&quot;校验、同步、审计，归档记录&quot;,&quot;args&quot;:&quot;--all&quot;}],&quot;currentIdx&quot;:1,&quot;currentPhase&quot;:{&quot;name&quot;:&quot;导入需求&quot;,&quot;key&quot;:&quot;doc&quot;,&quot;done&quot;:false,&quot;icon&quot;:&quot;📝&quot;,&quot;cmd&quot;:&quot;doc2spec&quot;,&quot;description&quot;:&quot;导入 PRD 文档，AI 转换需求规格&quot;,&quot;args&quot;:&quot;-f PRD.docx --iteration 期次-Q2&quot;}};

function handleAction(action, target) {
  const result = devRules(action, target, STATE);
  showResult(result);
}

function handleCustom() {
  const input = document.getElementById('userInput').value.trim();
  if (!input) return;
  document.getElementById('userInput').value = '';
  document.getElementById('resultSummary').textContent = '🤔 分析中...';
  const box = document.getElementById('resultBox');
  box.classList.add('show');
  
  // AI 模拟分析（300ms 延迟模拟 LLM 思考）
  document.getElementById('resultSummary').innerHTML = '<span style="animation:pulse 1s infinite">🤔 AI 分析中...</span>';
  setTimeout(() => {
    const result = devAI(STATE, input);
    showResult(result);
  }, 300);
}

function showResult(result) {
  const box = document.getElementById('resultBox');
  box.classList.add('show');
  document.getElementById('resultSummary').textContent = '🧠 ' + result.summary;
  
  let cmdsHtml = '';
  result.commands.forEach(c => {
    cmdsHtml += '<div class="result-cmd">$ speccore ' + c.command + (c.args ? ' ' + c.args : '') + '</div>';
    cmdsHtml += '<div style="font-size:10px;color:var(--muted);margin:2px 0 8px 4px;">→ ' + c.explanation + '</div>';
  });
  document.getElementById('resultCmds').innerHTML = cmdsHtml;
}

// ── Dev AI 引擎（前端规则层，模拟 LLM 行为）──
function devAI(state, input) {
  const iterArg = state.iteration ? ' --iteration=' + state.iteration : '';
  const lower = (input || '').toLowerCase();
  const phases = state.phases;
  const cur = state.currentPhase;

  const CMD_KB = {
    init:     { args:'',        desc:'初始化 SpecCore 项目结构',           trigger:['初始化','init','新建项目','创建项目'] },
    doc2spec: { args:'-f PRD.docx'+(iterArg), desc:'导入 PRD 文档，AI 转换需求规格', trigger:['导入','doc2spec','文档','PRD','需求文档','word'] },
    analyze:  { args:iterArg.replace('--iteration=','--iteration='),       desc:'AI 分析需求，生成审计报告',       trigger:['分析','analyze','审计','audit'] },
    split:    { args:'-f REQUIREMENT.md',                                  desc:'拆分需求为独立开发任务',          trigger:['拆分','split','分解','任务'] },
    plan:     { args:'--all',                                              desc:'生成最优执行计划',                trigger:['计划','plan','调度','安排'] },
    execute:  { args:'--auto --batch-size 3',                              desc:'按计划分批自动执行',              trigger:['执行','execute','开发','做','开始','run'] },
    pr:       { args:'--auto',                                             desc:'创建 Pull Request',               trigger:['pr','pull','提交','合并','MR'] },
    done:     { args:'--all',                                              desc:'校验、同步、归档收尾',           trigger:['完成','done','归档','结束'] },
  };

  // 1. 全部自动
  if (/一键|全部|自动|all|auto|搞定|剩下|remaining/i.test(lower)) {
    const pending = phases.filter(p => !p.done);
    if (pending.length === 0) return { summary:'所有阶段已完成！', commands:[{order:1,command:'dashboard',args:'--scope global',explanation:'查看全局仪表盘'}] };
    return { summary:'一键执行剩余 ' + pending.length + ' 个阶段', commands:pending.map((p,i) => {
      const kb = CMD_KB[p.key] || { args:'', desc:p.name };
      return { order:i+1, command:p.cmd, args:kb.args, explanation:kb.desc };
    })};
  }

  // 2. 跳过
  if (/跳过|skip|下一个|next/i.test(lower)) {
    const nextIdx = state.currentIdx + 1;
    if (nextIdx >= phases.length) return { summary:'已是最后阶段', commands:[{order:1,command:'done',args:'--all',explanation:'归档收尾'}] };
    const next = phases[nextIdx];
    const kb = CMD_KB[next.key] || { args:'', desc:next.name };
    return { summary:'跳过 ' + cur.name + ' → ' + next.name, commands:[{order:1,command:next.cmd,args:kb.args,explanation:kb.desc}] };
  }

  // 3. 阶段跳转
  for (const p of phases) {
    if (lower.includes(p.key) || lower.includes(p.name)) {
      const kb = CMD_KB[p.key] || { args:'', desc:p.name };
      if (p.done) return { summary:p.name + ' 已完成', commands:[{order:1,command:cur.cmd,args:CMD_KB[cur.key]?.args||iterArg,explanation:cur.name}] };
      return { summary:'跳转到「' + p.name + '」', commands:[{order:1,command:p.cmd,args:kb.args,explanation:kb.desc}] };
    }
  }

  // 4. 多阶段组合
  if (/先|再|然后|接着|最后|同时|也|之后|顺便|还有/.test(lower)) {
    const matched = [];
    for (const p of phases) {
      if (lower.includes(p.key) || lower.includes(p.name)) {
        const kb = CMD_KB[p.key] || { args:'', desc:p.name };
        matched.push({ cmd:p.cmd, args:kb.args, desc:kb.desc });
      }
    }
    if (matched.length >= 2) {
      return { summary:matched.length + ' 步组合执行', commands:matched.map((m,i) => ({ order:i+1, command:m.cmd, args:m.args, explanation:m.desc })) };
    }
  }

  // 5. 模糊匹配
  let bestCmd = null, bestScore = 0;
  for (const [key, kb] of Object.entries(CMD_KB)) {
    const score = kb.trigger.filter(t => lower.includes(t)).length;
    if (score > bestScore) { bestScore = score; bestCmd = key; }
  }
  if (bestCmd && bestScore > 0) {
    const p = phases.find(ph => ph.key === bestCmd);
    if (p && !p.done) {
      const kb = CMD_KB[bestCmd];
      return { summary:'建议: ' + p.name, commands:[{order:1,command:p.cmd,args:kb.args,explanation:kb.desc}] };
    }
  }

  // 6. 不明意图 → 列出选项
  return { summary:'你想怎么做？', commands:[
    {order:1,command:cur.cmd,args:CMD_KB[cur.key]?.args||iterArg,explanation:'继续当前: ' + cur.name},
    {order:2,command:'dashboard',args:'--scope global',explanation:'查看全局仪表盘'},
    {order:3,command:'ask',args:'"'+input+'"',explanation:'用 ask 万能入口重新分析'},
  ]};
}

// ── 按钮操作 ──
function handleAction(action, target) {
  const iterArg = STATE.iteration ? ' --iteration=' + STATE.iteration : '';
  const phases = STATE.phases;
  const cur = STATE.currentPhase;
  
  switch(action) {
    case 'auto-all': {
      const pending = phases.filter(p=>!p.done);
      showResult({ summary:'一键执行全部 '+pending.length+' 个阶段', commands:pending.map((p,i)=>({order:i+1,command:p.cmd,args:p.args||iterArg,explanation:p.description})) });
      return;
    }
    case 'next':
      showResult({ summary:'执行下一步: '+cur.name, commands:[{order:1,command:cur.cmd,args:cur.args||iterArg,explanation:cur.description}] });
      return;
    case 'skip-to': {
      const nextIdx = STATE.currentIdx + 1;
      if (nextIdx >= phases.length) { showResult({ summary:'已是最后阶段', commands:[{order:1,command:'dashboard',args:'--scope global',explanation:'查看全局仪表盘'}] }); return; }
      const next = phases[nextIdx];
      showResult({ summary:'跳过→'+next.name, commands:[{order:1,command:next.cmd,args:next.args||iterArg,explanation:next.description}] });
      return;
    }
    case 'jump-to': {
      const tp = phases.find(p=>p.key===target);
      if (!tp || tp.done) { showResult({ summary:tp?tp.name+' 已完成':'未找到', commands:[{order:1,command:cur.cmd,args:cur.args||iterArg,explanation:cur.name}] }); return; }
      showResult({ summary:'跳转→'+tp.name, commands:[{order:1,command:tp.cmd,args:tp.args||iterArg,explanation:tp.description}] });
      return;
    }
    case 'restart': {
      const fromIdx = phases.findIndex(p=>p.key===target);
      const fromList = phases.slice(Math.max(0,fromIdx));
      showResult({ summary:'从「'+(phases[fromIdx]?.name||'头')+'」重新开始', commands:fromList.map((p,i)=>({order:i+1,command:p.cmd,args:p.args||iterArg,explanation:p.description})) });
      return;
    }
    default:
      showResult({ summary:'执行: '+cur.name, commands:[{order:1,command:cur.cmd,args:cur.args||iterArg,explanation:cur.description}] });
  }
}
</script></body></html>
