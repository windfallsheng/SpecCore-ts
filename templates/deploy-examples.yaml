# --- systemd service 文件示例（/etc/systemd/system/order-service.service） ---
# [Unit]
# Description=Order Service
# After=network.target
#
# [Service]
# Type=simple
# User=deployer
# Group=deployer
# WorkingDirectory=/opt/services/order-service
# Environment="SPRING_PROFILES_ACTIVE=staging"
# Environment="JAVA_OPTS=-Xms512m -Xmx1024m -Dfile.encoding=UTF-8"
# ExecStart=/usr/bin/java $JAVA_OPTS -jar order-service.jar
# ExecStop=/bin/kill -SIGTERM $MAINPID
