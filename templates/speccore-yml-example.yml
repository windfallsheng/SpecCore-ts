# ═══════════════════════════════════════════════════════════
# SpecCore 主配置完整示例（.speccore.yml）—— v8.3.303 对齐版
# ═══════════════════════════════════════════════════════════
# 位置：项目根 .speccore.yml（与 .speccore/PROJECT.yaml 分工：
#       PROJECT.yaml 管「端/源码/Git/部署」，本文件管「行为/门禁/AI」）
# 升级：speccore config --upgrade（不要手动编辑 schema_version）
# 参考：docs/config-reference.md（字段详解）
#
# ⚠️ 本示例与 DEFAULT_CONFIG（v8.3.303）逐字段对齐，注意三处归属变化：
#   1. project → 已迁至 .speccore/PROJECT.yaml；tech_stack/team → 已废弃（升级自动清理）
#   2. tests/stages/pipeline 测试环境段 → 归属 .speccore/environments/{env}.yaml（见 VERIFY-EXAMPLE.yaml）
#   3. 新增：logging / tools / settings.pipeline / with_code / gates
# ═══════════════════════════════════════════════════════════

schema_version: 1

# ── 日志（文件日志开关，输出到 .speccore/local/logs/）──
logging:
  enabled: false

# ── 质量门禁 ──
quality_gates:
  enforce_testing: true       # true → execute 前检查 TEST.md，缺失则阻断
  enforce_review: true        # true → 执行完自动进入 review 流程
  require_pr: true            # true → 禁止直接 push 保护分支，走 speccore pr
  # 阻塞级别：standard（编译+单测+契约都阻断，默认）/ compile（仅编译阻断）
  block_level: standard
  # v8.3.95+: UI 验证默认行为（speccore verify --ui）
  verify_ui:
    enabled: false            # 演示默认关闭，按需 true
    smoke_test: true          # 冒烟测试
    visual_check: true        # 视觉检查
    headed: false             # 有头浏览器（调试用）
    # threshold: strict 任何微小差异 / normal 明显差异（默认）/ loose 仅严重问题
    threshold: normal
    devices: [desktop]        # desktop / mobile / iPhone13 / Pixel5 ...
    browsers: [chromium]
    timeout: 30000            # 单场景超时（毫秒）
    # v8.3.50+: 视觉模型（看图判断走外部模型）
    visual_model:
      provider: qwen-vl       # qwen-vl / openai / anthropic / local
      model: qwen-vl-max

# ── 契约裁决：full 全流程 / l1-only / report-only ──
arbitration:
  enabled: true
  mode: full

# ── 运行时行为 ──
settings:
  # 指派策略：strict 阻断不一致 / loose 自动填+警告 / off 关闭
  assignee:
    enabled: true
    mode: loose
  # 双向追溯 + @spec 注释
  trace:
    enabled: true
    auto_annotate: true
  # 归档时自动清理
  archive:
    auto_cleanup: false
  # 并行执行建议
  plan:
    parallel_suggest: true
  # 严格校验模式
  validation:
    strict_mode: false
  # 自动检查规范库最新
  sync:
    auto_check: true
  # 模式沉淀：off / smart / aggressive
  patterns:
    auto_save: smart
  # 审查时检查执行人签名
  review:
    check_assignee: false
  # v8.3.94+: 视觉模型（specs 文档图片理解，默认关闭）
  vision:
    enabled: false
    provider: qwen-vl
    model: qwen-vl-plus
    maxImagesPerPrompt: 10
    imageMaxSizeKb: 2048
  # 流水线模式开关
  pipeline: false
  # 分析时附带源码（from-source 场景）
  with_code: false
  # 非必要流水线步骤三态开关：auto（智能，默认）/ on 强制 / off 跳过
  optional_steps:
    clarify: auto             # 文档专业就跳过澄清
    verify: auto
    pipeline: auto
    pr: auto
    done: auto
    spec2doc: auto
  # 命名流水线（run --preset <name>）
  pipelines:
    default: develop          # full/import/spec/analyze/develop/deliver/deploy/docs
    custom: {}                # 自定义: { my-flow: analyze,validate,taskify,plan,execute }
  # 质量门禁模式
  gates:
    mode: manual
  # v8.3.193+: 统一 LLM provider 池（host=宿主AI / llm=自配 / auto=宿主优先）
  # 演示条目，默认 providers: []——自配时按此结构填写
  ai:
    provider: host
    providers:
      - name: local
        type: ollama
        endpoint: "http://localhost:11434"
        model: qwen2.5:7b
        priority: 1
      - name: gpt4o
        type: openai
        model: gpt-4o
        apiKey: "${OPENAI_API_KEY}"
        priority: 2
    defaults: {}              # 按阶段指定 provider: { analyze: gpt4o }
    fallback: local
  # v8.3.301+: 子 Agent SDK 派单开关
  #   auto = Qoder 宿主 + token 可用（PAT 或 CLI 登录态）时启用（默认）
  #   on   = 强制尝试 SDK 派单（失败回退标记模式）
  #   off  = 禁用 SDK 派单，永远走标记模式
  agent_dispatch:
    mode: auto
  # v8.3.217+: 冒烟三时机开关 + 范围（run --smoke / --skip-smoke / --scope 单次覆盖）
  smoke:
    points:
      local: auto             # 开发完本地冒烟
      pre-deploy: auto        # 部署前门禁
      post-deploy: auto       # 部署后确认环境活着
    scope: module             # full 全量 / module 当前功能模块
    scope_by_env: {}          # 按环境覆盖: { production: full }

# ── Ask 引擎 ──
ask:
  routing:
    mode: hybrid              # hybrid / cli-only / host-ai-only
    high_threshold: 70
    low_threshold: 45
    auto_host_ai: true
    cache_enabled: true
    cache_min_hits: 3
  rules:
    force_host_ai: false
  # 自配 LLM 池（演示条目，默认 []）
  llm_providers:
    - name: ollama-local
      enabled: false
      type: ollama
      endpoint: http://localhost:11434
      model: qwen2.5:7b
      priority: 1
    - name: openai-compatible
      enabled: false
      type: openai
      endpoint: https://api.openai.com/v1/chat/completions
      model: gpt-4o-mini
      priority: 2

# ── 工具路径（doc2spec 转换依赖，留空自动探测）──
tools:
  pandoc: ''
  libreoffice: ''

# ── 配置变更历史（speccore config --upgrade 自动维护，勿手动编辑）──
config_history: []
